<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Comercial - Clínica</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js for Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1><i class="fa-solid fa-users-rays"></i> CRM Amigo App</h1>
        </div>

        <div class="tabs-container">
            <button class="tab-btn" onclick="window.location.href='index.html'" id="tab-kanban">
                <i class="fa-solid fa-table-columns"></i> CRM Vendas
            </button>
            <button class="tab-btn active" onclick="window.location.href='agenda.html'" id="tab-agenda">
                <i class="fa-regular fa-calendar-days"></i> Agenda Completa
            </button>
            <button class="tab-btn" onclick="window.location.href='dashboard.html'" id="tab-dashboard" style="background: rgba(99, 102, 241, 0.1); color: var(--accent-primary); border-color: rgba(99, 102, 241, 0.3);">
                <i class="fa-solid fa-chart-pie"></i> Dashboard VIP
            </button>

            <div class="dropdown">
                <button class="tab-btn" id="tab-relacionamento-main">
                    <i class="fa-solid fa-heart" style="color: var(--accent-success)"></i> Relacionamento <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; margin-left: 0.3rem; opacity: 0.7;"></i>
                </button>
                <div class="dropdown-content">
                    <button class="tab-btn" onclick="window.location.href='posvenda.html'" id="tab-posvenda">
                        <i class="fa-solid fa-star" style="color: var(--accent-warning)"></i> Pós-Venda
                    </button>
                    <button class="tab-btn" onclick="window.location.href='faltantes.html'" id="tab-faltantes">
                        <i class="fa-solid fa-user-xmark" style="color: var(--accent-danger)"></i> Faltantes
                    </button>
                    <button class="tab-btn" onclick="window.location.href='sumidos.html'" id="tab-sumidos">
                        <i class="fa-solid fa-user-clock" style="color: var(--accent-danger)"></i> Sumidos
                    </button>
                    <button class="tab-btn" onclick="window.location.href='aniversariantes.html'" id="tab-aniversariantes">
                        <i class="fa-solid fa-cake-candles" style="color: var(--accent-primary)"></i> Aniversariantes
                    </button>
                </div>
            </div>
        </div>

        <div class="actions" style="display: flex; gap: 1rem; align-items: center;">
            <button class="btn-secondary" onclick="openMktReportModal()" title="Relatório de Marketing" style="display: flex; align-items: center; gap: 0.5rem; background: #6c5ce7; color: white; border: 1px solid white; font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <i class="fa-solid fa-chart-pie"></i> Relatório MKT
            </button>
            <button class="btn-secondary" id="theme-toggle" onclick="toggleTheme()" title="Mudar Tema" style="padding: 0.5rem; width: 40px; height: 40px; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="btn-primary" onclick="openNewLeadModal()">
                <i class="fa-solid fa-plus"></i> Novo Paciente
            </button>
        </div>
    </header>

    <!-- ABA 2: AGENDA GRADE COMPLETA -->
    <div class="agenda-grid-container" id="view-agenda" style="display: block;">
        <div class="agenda-grid-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <!-- Lado Esquerdo (Busca) -->
            <div class="agenda-actions">
                <div style="position: relative;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" id="agenda-search-input" placeholder="Buscar paciente..." oninput="filterAgenda(this.value)" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-color); padding: 0.5rem 1rem 0.5rem 2.2rem; border-radius: 8px; outline: none; width: 220px; transition: all 0.3s ease;">
                </div>
            </div>

            <!-- Lado Direito (Navegação de Data) -->
            <div class="agenda-filters" style="display: flex; align-items: center; gap: 0.5rem; font-family: 'Inter', sans-serif;">
                <button class="btn-secondary" style="border: 1px solid var(--border-color); padding: 0.4rem 0.7rem; border-radius: 6px; background: transparent; color: var(--text-color);" onclick="changeAgendaDate(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="agenda-date-display" style="font-weight: 700; font-size: 0.95rem; text-align: center; color: var(--text-color); margin: 0 0.5rem;">Hoje</span>
                <button class="btn-secondary" style="border: 1px solid var(--border-color); padding: 0.4rem 0.7rem; border-radius: 6px; background: transparent; color: var(--text-color);" onclick="changeAgendaDate(1)"><i class="fa-solid fa-chevron-right"></i></button>
                <button class="btn-secondary" style="border: 1px solid var(--border-color); padding: 0.4rem 1rem; border-radius: 6px; background: transparent; font-weight: 500; font-size: 0.9rem; color: var(--text-color);" onclick="resetAgendaDate()">Hoje</button>
                <div style="position: relative;">
                    <button class="btn-secondary" style="border: 1px solid var(--border-color); padding: 0.4rem 0.7rem; border-radius: 6px; background: transparent; color: var(--text-color);" onclick="document.getElementById('hidden-date-picker')._flatpickr.open()"><i class="fa-regular fa-calendar-check"></i></button>
                    <input type="date" id="hidden-date-picker" onchange="jumpToDate(this.value)" style="position: absolute; opacity: 0; width: 10px; height: 10px; bottom: 0; right: 0; pointer-events: none; border: none; padding: 0; z-index: -1;">
                </div>
                <div class="agenda-loader" style="display: none; margin-left: 0.5rem;"><i class="fa-solid fa-circle-notch spin"></i></div>
            </div>
        </div>

        <div class="agenda-grid-wrapper">
            <div class="agenda-grid-layout" id="agenda-grid-layout">
                <!-- O cabeçalho das colunas (Horário e Profissionais) será injetado pelo JS -->

                <!-- CORPO DA GRADE (Gerado via JS) -->
                <div class="grid-body" id="agenda-grid-body">
                    <!-- Horários e blocos de consulta -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Novo Lead -->
    <div class="modal-overlay" id="modalNewLead">
        <div class="modal">
            <h2><i class="fa-solid fa-user-plus"></i> Cadastrar Paciente</h2>
            <div class="form-group">
                <label>Nome do Paciente</label>
                <input type="text" id="nl-nome" placeholder="Ex: Maria da Silva">
            </div>
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" id="nl-telefone" placeholder="(61) 99999-9999">
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="lead-born" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Origem (Opcional)</label>
                <select id="lead-origem" class="form-control">
                    <option value="Meta Ads">Meta Ads (Facebook/Insta)</option>
                    <option value="Google Meu Negócio">Google Meu Negócio</option>
                    <option value="Indicação">Indicação</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-save" onclick="saveNewLead()">Salvar Lead</button>
            </div>
        </div>
    </div>

    <!-- Modal Agendamento (Integração) -->
    <div class="modal-overlay" id="modalAgendamento">
        <div class="modal">
            <h2><i class="fa-solid fa-robot" style="color: var(--accent-primary)"></i> Integração Amigo App</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Você arrastou este paciente para "Agendado". Confirme os dados abaixo para enviar automaticamente para a agenda do Amigo App via Vercel.
            </p>
            <form id="form-agendar">
            <input type="hidden" id="ag-lead-id">            <!-- Campos extras para agendamento direto pela grade -->
            <div id="directScheduleFields" style="display: none;">
                <div class="form-group">
                    <label>Nome do Paciente</label>
                    <input type="text" id="ag-patient-name" class="form-control" placeholder="Ex: João da Silva">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Telefone (WhatsApp)</label>
                        <input type="text" id="ag-patient-phone" class="form-control" placeholder="(61) 99999-9999">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Data de Nascimento</label>
                        <input type="date" id="ag-patient-born" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="ag-patient-email" class="form-control" placeholder="email@exemplo.com">
                </div>
            </div>


            <div class="form-group">
                <label>Local (Clínica)</label>
                <select id="ag-place" class="form-control" required>
                    <option value="">Carregando locais...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Profissional (Médico/Estética)</label>
                <select id="ag-user" class="form-control" required>
                    <option value="">Carregando profissionais...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Procedimento / Serviço</label>
                <select id="ag-event" class="form-control" required>
                    <option value="">Carregando serviços...</option>
                </select>
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Data</label>
                    <input type="date" id="ag-data" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Horário</label>
                    <input type="time" id="ag-hora" class="form-control" required>
                </div>
            </div>
            </form>

            <div class="integration-loader" id="integrationLoader">
                <i class="fa-solid fa-circle-notch spin"></i> Chamando API da Vercel (Seguro)...
            </div>

            <div class="modal-actions" id="integrationActions">
                <button class="btn-cancel" onclick="cancelAgendamento()">Desfazer</button>
                <button class="btn-save" onclick="confirmAgendamento()">Agendar no Sistema</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
